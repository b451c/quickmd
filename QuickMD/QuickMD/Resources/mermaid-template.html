<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; }
  #output { display: flex; justify-content: center; }
  #output svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<div id="output"></div>
<script src="mermaid.min.js"></script>
<script>
  function renderDiagram(source, isDark) {
    // renderDiagram may run repeatedly on this page (theme switches re-render
    // in place). mermaid.render can leave its temp element behind after a
    // failed render — remove it or the next render throws on a duplicate id.
    var stale = document.getElementById('ddiagram');
    if (stale) stale.remove();

    mermaid.initialize({
      startOnLoad: false,
      theme: isDark ? 'dark' : 'default',
      securityLevel: 'strict',
      fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif'
    });

    const container = document.getElementById('output');
    container.innerHTML = '';

    // Report height back to Swift. The zoom viewer hosts this same template
    // WITHOUT a mermaidHeight handler -- the report must never break rendering
    // (an unguarded postMessage throws, and the catch() below would replace a
    // perfectly good SVG with the error text).
    function reportHeight() {
      try {
        window.webkit.messageHandlers.mermaidHeight.postMessage(
          container.getBoundingClientRect().height
        );
      } catch (e) { /* no handler in this host -- fine */ }
    }

    mermaid.render('diagram', source).then(function(result) {
      container.innerHTML = result.svg;
      reportHeight();
    }).catch(function(err) {
      container.innerHTML = '<pre style="color:#e55;font-size:12px;padding:8px;">' +
        err.message.replace(/</g, '&lt;') + '</pre>';
      reportHeight();
    });
  }
</script>
</body>
</html>
